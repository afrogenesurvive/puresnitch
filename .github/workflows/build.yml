name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache GeoIP database
        uses: actions/cache@v4
        with:
          path: Resources/GeoIP/dbip-city-lite.mmdb
          key: geoip-${{ runner.os }}-dbip-city-lite-2026-09

      # The city database is 121 MB, above GitHub's per-file limit, so it is
      # gitignored and fetched here. The script verifies the pinned SHA1, so a
      # stale or corrupted cache fails loudly instead of shipping wrong data.
      - name: Fetch GeoIP database
        run: Scripts/fetch_geoip.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild \
            -project PureSnitch.xcodeproj \
            -scheme PureSnitch \
            -configuration Debug \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run hardening regression tests
        run: Scripts/test_hardening.sh

      - name: Verify app bundle
        run: |
          APP=build/dd/Build/Products/Debug/PureSnitch.app
          test -d "$APP"
          test -f "$APP/Contents/MacOS/PureSnitch"
          test -f "$APP/Contents/MacOS/PureSnitchHelper"
          test -f "$APP/Contents/Library/LaunchDaemons/io.moamenbasel.puresnitch.helper.plist"
          test -f "$APP/Contents/Resources/Assets.car"
          test -f "$APP/Contents/Resources/GeoIP/dbip-city-lite.mmdb"
          echo "App bundle structure OK (helper + app icon + geolocation database)"

  universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache GeoIP database
        uses: actions/cache@v4
        with:
          path: Resources/GeoIP/dbip-city-lite.mmdb
          key: geoip-${{ runner.os }}-dbip-city-lite-2026-09

      - name: Fetch GeoIP database
        run: Scripts/fetch_geoip.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build universal (Release, ad-hoc signed)
        run: |
          xcodebuild \
            -project PureSnitch.xcodeproj \
            -scheme PureSnitch \
            -configuration Release \
            -derivedDataPath build/rel \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify universal slices (arm64 + x86_64)
        run: |
          APP=build/rel/Build/Products/Release/PureSnitch.app
          for BIN in "$APP/Contents/MacOS/PureSnitch" "$APP/Contents/MacOS/PureSnitchHelper"; do
            echo "== $BIN =="
            lipo -info "$BIN"
            lipo -archs "$BIN" | grep -qw arm64
            lipo -archs "$BIN" | grep -qw x86_64
          done
          echo "Universal (arm64 + x86_64) verified for app and helper"

      - name: Verify no restricted entitlements leaked into the shipping build
        run: |
          ENT_REL=$(xcodebuild \
            -project PureSnitch.xcodeproj \
            -target PureSnitch \
            -configuration Release \
            -showBuildSettings \
            | awk -F ' = ' '/^[[:space:]]*CODE_SIGN_ENTITLEMENTS = / && !found { print $2; found=1 }')

          test "$ENT_REL" = "Sources/GUI/PureSnitch.entitlements"
          ENT="$GITHUB_WORKSPACE/$ENT_REL"
          test -f "$ENT"
          plutil -lint "$ENT"

          for KEY in \
            com.apple.developer.networking.networkextension \
            com.apple.developer.system-extension.install; do
            if /usr/libexec/PlistBuddy -c "Print :$KEY" "$ENT" >/dev/null 2>&1; then
              echo "ERROR: restricted shipping entitlement present: $KEY"
              exit 1
            fi
          done

          EXPECTED_GROUP=H3WXHVTP97.io.moamenbasel.puresnitch
          ACTUAL_GROUP=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$ENT")
          test "$ACTUAL_GROUP" = "$EXPECTED_GROUP"
          if /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:1" "$ENT" >/dev/null 2>&1; then
            echo "ERROR: shipping app contains an unexpected additional app group"
            exit 1
          fi
          echo "Shipping entitlements verified: expected app group, no profile-gated capabilities"
